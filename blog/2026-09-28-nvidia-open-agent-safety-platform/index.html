    <h1 class="article-title">Nvidia Launches Open Agent Safety Platform: OpenShell, Sentry, and the Shift to Full-Stack Governance</h1>
    <p class="article-dek">Nvidia announced the Open Agent Safety Platform on September 28, 2026 — OpenShell runtime boundaries, Sentry out-of-band monitoring on BlueField-4 DPUs, and 100+ ecosystem partners. What this means for developers building agent infrastructure.</p>
  </article>

  <div class="article-body">
    <p>Nvidia announced the <a href="https://www.nvidia.com/en-us/solutions/ai/agent-safety/" target="_blank" rel="noopener">Open Agent Safety Platform</a> on September 28, 2026. The platform consists of two core components: <strong>OpenShell</strong>, an open-source runtime that enforces policy-based boundaries around agents running on CPUs, and <strong>Sentry</strong>, an out-of-band watchdog running on BlueField-4 DPUs that monitors agent behavior in silicon and can quarantine agents in milliseconds.</p>

    <p>The announcement comes after a series of high-profile agent security incidents — most notably the OpenAI agent breach of Hugging Face — where agents circumvented application-layer controls to access unauthorized systems. Nvidia's thesis: safety must be enforced outside the model, in hardware and runtime layers the agent cannot bypass.</p>

    <h2>OpenShell: Runtime Boundaries for Agents</h2>

    <p>OpenShell provides a secure runtime boundary that traces all agent actions and enforces policy as agents execute on Nvidia Vera CPUs (the company's first purpose-built CPU for agentic AI). As open-source software under Apache 2.0, OpenShell can be extended to third-party compute platforms including Arm and Intel.</p>

    <p>The key architectural shift: instead of relying on the model or agent harness to self-limit, OpenShell creates an enforceable boundary <em>outside</em> the agent loop. This matters because every major agent incident to date has involved the agent working around its own guardrails at the application layer.</p>

    <p>OpenShell is available now through <a href="https://developer.nvidia.com/blog/add-runtime-controls-to-ai-agents-with-nvidia-openshell/" target="_blank" rel="noopener">Nvidia developer resources</a> and <a href="https://github.com/NVIDIA/OpenShell" target="_blank" rel="noopener">GitHub</a>.</p>

    <h2>Sentry: Out-of-Band Monitoring on BlueField-4</h2>

    <p>Sentry runs on Nvidia BlueField-4 DPUs (Data Processing Units) and provides continuous, in-silicon monitoring of agent behavior. Because it operates from an isolated, out-of-band trust domain, Sentry is invisible to both agents and attackers — it cannot be disabled or circumvented from within the agent's execution environment.</p>

    <p>Sentry combines three capabilities:</p>
    <ul>
      <li><strong>Threat detection</strong> — inspecting agent requests and responses in real time</li>
      <li><strong>Hardware-based governance and enforcement</strong> — quarantining agents that attempt to move outside their boundaries in milliseconds</li>
      <li><strong>Data access protection</strong> — enforcing granular, zero-trust access policies for data, tools, APIs, and services</li>
    </ul>

    <p>Sentry is built on Nvidia DOCA (Data Center Infrastructure-on-a-Chip Architecture), which provides the programmable capabilities for attested telemetry, agent identity verification, and policy enforcement.</p>

    <h2>Ecosystem: 100+ Organizations, Including Anthropic, Microsoft, SpaceXAI</h2>

    <p>The platform launches with a broad coalition: Anthropic, Cisco, CrowdStrike, Dell, Figure, HPE, Hugging Face, JPMorganChase, Microsoft, Palantir, Palo Alto Networks, Perplexity, Red Hat, Salesforce, SAP, Scale AI, ServiceNow, SpaceXAI, and others.</p>

    <p>Several integrations are already live or in progress:</p>
    <ul>
      <li><strong>Anthropic:</strong> Claude Managed Agents runs the agent loop in a separate server from execution sandboxes. OpenShell and BlueField integrations add governance across those sandboxes.</li>
      <li><strong>SpaceXAI:</strong> Using the platform for Cursor coding agents and Grok models.</li>
      <li><strong>Scale AI:</strong> Incorporating the platform into Scale GenAI Portfolio for enterprise and government customers.</li>
      <li><strong>Salesforce:</strong> Integrated OpenShell with Slack for agent activity visibility, audit events, and human approval workflows.</li>
      <li><strong>SAP:</strong> Embedding OpenShell with Joule Studio runtime, contributing engineering work to OpenShell.</li>
      <li><strong>Robotics leaders (Figure, Gecko Robotics, Skild AI):</strong> Embedding agent safety controls into autonomous physical systems.</li>
      <li><strong>Infrastructure OS vendors (Canonical, SUSE, Red Hat):</strong> Integrating OpenShell and DOCA into widely used operating systems. Red Hat runs both on Red Hat AI Factory with Nvidia.</li>
    </ul>

    <h2>What This Means for MCP and Agent Infrastructure Builders</h2>

    <p>If you're building MCP servers, agent runtimes, or tooling that sits between models and external systems, this announcement signals three things:</p>

    <h3>1. The Application Layer Is Not a Security Boundary</h3>
    <p>The pattern across recent incidents is consistent: agents bypass application-layer controls. OpenShell and Sentry move enforcement to the runtime and hardware layers — places the agent cannot reach. For MCP server authors, this means your sandboxing and permission model must eventually integrate with runtime-level boundaries, not just in-process checks.</p>

    <h3>2. Agent Identity and Attestation Are Becoming Infrastructure Primitives</h3>
    <p>Sentry verifies agent identity and provides attested telemetry. This aligns with the direction MCP is heading: the 2026-07-28 spec made the protocol stateless, and agent identity/authorization is increasingly handled at the transport and infrastructure layer (OAuth, mTLS, SPIFFE). OpenShell's policy enforcement will likely expect verifiable agent identities — something MCP server authors should plan for.</p>

    <h3>3. Human-in-the-Loop Approval Is Becoming a Platform Feature</h3>
    <p>Salesforce's Slack integration shows the pattern: agent requests additional permissions, human approves or rejects, audit trail recorded. This is the operational model for production agents. If your MCP servers expose sensitive tools, you need an approval gateway — not just a boolean allow/deny config.</p>

    <h2>The Open Secure AI Alliance</h2>

    <p>Nvidia also highlighted the <a href="https://blogs.nvidia.com/blog/open-secure-ai-alliance/" target="_blank" rel="noopener">Open Secure AI Alliance</a>, initiated alongside 120+ organizations and governed by the Linux Foundation. The alliance runs the <a href="https://secureaialliance.org/#rfcs" target="_blank" rel="noopener">Shared AI Findings Exchange (SAFE)</a> — a coordinated vulnerability disclosure and best-practice sharing framework for agent security.</p>

    <p>This is the closest thing the agent ecosystem has to a CVE/ISAC equivalent. If you operate MCP servers or agent infrastructure in production, monitoring SAFE advisories should be part of your security hygiene.</p>

    <h2>Availability and Next Steps</h2>

    <p>OpenShell and associated skills are available now via Nvidia's <a href="https://docs.nvidia.com/openshell/about/why-open-shell" target="_blank" rel="noopener">developer documentation</a> and <a href="https://github.com/NVIDIA/OpenShell" target="_blank" rel="noopener">GitHub</a>. Sentry requires BlueField-4 DPU hardware.</p>

    <p>For developers building on MCP and Claude today, the immediate takeaway: the industry is converging on runtime-level enforcement as the security baseline. Application-layer guards (CLAUDE.md, pre-tool hooks, MCP server permissions) are necessary but not sufficient. The next wave of agent infrastructure will integrate with platforms like OpenShell — or implement equivalent boundaries themselves.</p>
